[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auroramic"
version = "0.1.0"
description = "Floating always-on-top Windows voice-to-text microphone overlay powered by Groq Whisper."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "python-dotenv",
    "pillow",
    "pywin32",
    "numpy",
    "sounddevice",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
py-modules = [
    "config",
    "main",
    "recorder",
    "transcriber",
    "typer",
    "ui",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
